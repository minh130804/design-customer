<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <rect width="1200" height="900" fill="#ffffff"/>
  <g font-family="Inter, system-ui, sans-serif">
    <text x="60" y="86" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#222">Size chart</text>
    <text x="60" y="120" font-size="17" fill="#757575">
      Lotus Tee · relaxed unisex fit · measurements in inches, garment laid flat
    </text>

    <!-- đầu bảng -->
    <rect x="60" y="150" width="1080" height="52" fill="#f7f7f7"/>
    <g font-size="15" font-weight="700" fill="#595959" letter-spacing="1">
      <text x="86" y="182">SIZE</text>
      <text x="266" y="182">CHEST</text>
      <text x="446" y="182">BODY LENGTH</text>
      <text x="686" y="182">SLEEVE</text>
      <text x="886" y="182">SHOULDER</text>
      <text x="1046" y="182">FITS</text>
    </g>

    <!-- các dòng -->
    <g font-size="17" fill="#222">
      <g>
        <rect x="60" y="202" width="1080" height="56" fill="#ffffff"/>
        <text x="86" y="238" font-weight="700">S</text>
        <text x="266" y="238">19.5</text><text x="446" y="238">27.0</text>
        <text x="686" y="238">8.1</text><text x="886" y="238">17.7</text>
        <text x="1046" y="238" fill="#757575">34–36</text>
      </g>
      <g>
        <rect x="60" y="258" width="1080" height="56" fill="#fafafa"/>
        <text x="86" y="294" font-weight="700">M</text>
        <text x="266" y="294">21.0</text><text x="446" y="294">28.0</text>
        <text x="686" y="294">8.7</text><text x="886" y="294">19.1</text>
        <text x="1046" y="294" fill="#757575">37–39</text>
      </g>
      <g>
        <rect x="60" y="314" width="1080" height="56" fill="#fff3e7"/>
        <text x="86" y="350" font-weight="700">L</text>
        <text x="266" y="350">22.5</text><text x="446" y="350">29.0</text>
        <text x="686" y="350">9.3</text><text x="886" y="350">20.5</text>
        <text x="1046" y="350" fill="#757575">40–42</text>
        <text x="1120" y="350" text-anchor="end" font-size="13" fill="#cf4018" font-weight="700">SHOWN</text>
      </g>
      <g>
        <rect x="60" y="370" width="1080" height="56" fill="#fafafa"/>
        <text x="86" y="406" font-weight="700">XL</text>
        <text x="266" y="406">24.0</text><text x="446" y="406">30.0</text>
        <text x="686" y="406">9.8</text><text x="886" y="406">21.9</text>
        <text x="1046" y="406" fill="#757575">43–45</text>
      </g>
    </g>
    <g stroke="#dbdbdb" stroke-width="1">
      <path d="M60 202 H1140 M60 258 H1140 M60 314 H1140 M60 370 H1140 M60 426 H1140"/>
    </g>

    <!-- chú thích cỡ nhỏ — chỉ đọc được khi phóng to -->
    <g font-size="13" fill="#757575">
      <text x="60" y="480">Chest — measured 1 in below the armhole, across the front, then doubled.</text>
      <text x="60" y="504">Body length — from the highest point of the shoulder seam to the bottom hem.</text>
      <text x="60" y="528">Tolerance ±0.5 in. The fabric is pre-shrunk; expect under 3% shrinkage after the first wash at 30 °C.</text>
      <text x="60" y="552">This is a relaxed cut. If you want a regular fit, size down one step.</text>
    </g>

    <!-- sơ đồ đo -->
    <g transform="translate(760 600)">
      <path d="M0 0 L60 -22 Q110 8 160 -22 L220 0 L262 46 L232 80 L212 62 L212 300 Q110 322 8 300 L8 62 L-12 80 L-42 46 Z"
            fill="none" stroke="#222" stroke-width="2"/>
      <g stroke="#cf4018" stroke-width="2" stroke-dasharray="6 4">
        <path d="M8 96 H212"/><path d="M110 -10 V300"/>
      </g>
      <g font-size="13" fill="#cf4018" font-weight="700">
        <text x="222" y="100">chest</text>
        <text x="118" y="-18">length</text>
      </g>
    </g>

    <text x="60" y="860" font-size="12" fill="#949494">
      Lotus Studio · printed to order · measurements verified on production samples, batch 2026-07
    </text>
  </g>
</svg>
