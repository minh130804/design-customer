<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <!--
    Ảnh đại diện dạng CHUYỂN ĐỘNG cho listing `lotus-tee`.

    Đây là SVG có animation chứ không phải MP4: máy dựng bản demo này không có
    bộ mã hoá video nào, và một file .mp4 giả sẽ không phát được. Trình duyệt
    chạy animation trong SVG kể cả khi nó nằm trong <img>, nên hành vi "rê chuột
    là phát" giống hệt.

    Ở bản thật, seller tải lên .mp4 và `MediaFrame` render <video> — cùng một
    kiểu dữ liệu `ProductMedia`, chỉ khác phần mở rộng của `src`.
  -->
  <style>
    .shirt   { transform-origin: 600px 620px; animation: sway 6s ease-in-out infinite; }
    .petal   { stroke-dasharray: 620; stroke-dashoffset: 620; animation: draw 6s ease-in-out infinite; }
    .p2 { animation-delay: .35s } .p3 { animation-delay: .5s }
    .p4 { animation-delay: .65s } .p5 { animation-delay: .8s } .p6 { animation-delay: .95s }
    .word    { opacity: 0; animation: fade 6s ease-in-out infinite; animation-delay: 1.4s }
    .glow    { transform-origin: 600px 620px; animation: pulse 6s ease-in-out infinite; }

    @keyframes sway {
      0%, 100% { transform: scale(1)     rotate(0deg) }
      45%      { transform: scale(1.035) rotate(-1.1deg) }
    }
    @keyframes draw {
      0%       { stroke-dashoffset: 620 }
      35%, 88% { stroke-dashoffset: 0 }
      100%     { stroke-dashoffset: 620 }
    }
    @keyframes fade {
      0%, 12%  { opacity: 0 }
      40%, 84% { opacity: 1 }
      100%     { opacity: 0 }
    }
    @keyframes pulse {
      0%, 100% { opacity: .12; transform: scale(.82) }
      50%      { opacity: .30; transform: scale(1.06) }
    }

    /* Người bật "giảm chuyển động" ở hệ điều hành đang nói rõ là chuyển động
       làm họ khó chịu. Dừng hẳn, và giữ khung hình ở trạng thái đã vẽ xong. */
    @media (prefers-reduced-motion: reduce) {
      .shirt, .petal, .word, .glow { animation: none }
      .petal { stroke-dashoffset: 0 }
      .word  { opacity: 1 }
    }
  </style>

  <rect width="1200" height="1200" fill="#f4f2ee"/>

  <g class="shirt">
    <path fill="#222222"
          d="M420 250 L520 210 Q600 270 680 210 L780 250 L860 330 L800 400 L760 370 L760 980 Q600 1010 440 980 L440 370 L400 400 L340 330 Z"/>
    <g stroke="#3a3a3a" stroke-width="2" fill="none" opacity=".7">
      <path d="M470 300 Q600 340 730 300"/>
      <path d="M448 372 L448 970"/><path d="M752 372 L752 970"/>
    </g>

    <circle class="glow" cx="600" cy="620" r="190" fill="#e8e2d4"/>

    <g transform="translate(600 620)">
      <g fill="none" stroke="#e8e2d4" stroke-width="5" stroke-linecap="round">
        <path class="petal"    d="M0 -110 C 52 -58 52 30 0 88 C -52 30 -52 -58 0 -110 Z"/>
        <path class="petal p2" d="M0 88 C -60 40 -118 40 -150 -6 C -96 -34 -40 -14 0 30"/>
        <path class="petal p3" d="M0 88 C 60 40 118 40 150 -6 C 96 -34 40 -14 0 30"/>
        <path class="petal p4" d="M0 88 C -30 130 -96 148 -140 138 C -110 96 -50 74 0 88"/>
        <path class="petal p5" d="M0 88 C 30 130 96 148 140 138 C 110 96 50 74 0 88"/>
        <circle class="petal p6" cx="0" cy="10" r="16"/>
      </g>
      <text class="word" x="0" y="188" text-anchor="middle" font-family="Georgia, serif"
            font-size="30" letter-spacing="8" fill="#e8e2d4">LOTUS</text>
    </g>
  </g>

  <text x="600" y="1140" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
        font-size="26" fill="#8a8578">Studio clip · the print going on</text>
</svg>
